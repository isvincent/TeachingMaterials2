function resize(){let scale=document.querySelector('.viewport').clientWidth/1080;$('canvas').style.transform=`scale(${scale})`}
new ResizeObserver(resize).observe(document.querySelector('.viewport'));
function stopSpeech(){if(synth)synth.cancel();speechCaption=null}
let spokenSlide=-1,speechCaption=null;function speak(text){if(!synth||muted||!playing||!started)return;stopSpeech();let u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=1;u.pitch=1;u.volume=1;u.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))$('status').textContent='此裝置語音未能播放；字幕與時間軸仍可使用。'};const startSlide=current;const chunks=LESSON.slides[current].captions.slice(Math.min(4,Math.floor((t%30)/6)));let offsets=[],offset=0;chunks.forEach(c=>{offsets.push(offset);offset+=c.length+1});u.onboundary=e=>{if(current!==startSlide)return;let idx=offsets.findLastIndex(o=>e.charIndex>=o);speechCaption=chunks[Math.max(0,idx)];$('caption').textContent=speechCaption};u.onend=()=>{if(current===startSlide)speechCaption=null};synth.speak(u)}
function cueIndex(){return Math.min(49,Math.floor(t/6))}
function render(force=false){const i=Math.min(9,Math.floor(t/30)),slide=LESSON.slides[i];if(i!==current||force){current=i;$('subject').textContent=LESSON.subject;$('tag').textContent=`${String(i+1).padStart(2,'0')} / ${slide.tag}`;$('title').textContent=slide.title;$('points').innerHTML=slide.points.map(s=>`<div class="point">${esc(s)}</div>`).join('');$('visual').innerHTML=visual(slide.visual);$('number').textContent=`${i+1} / 10`;$('scene').classList.remove('scene');void $('scene').offsetWidth;$('scene').classList.add('scene');document.querySelectorAll('.chapters button').forEach((b,j)=>b.classList.toggle('active',i===j));$('question').textContent=slide.question;$('answers').innerHTML=slide.options.map((s,j)=>`<button data-answer="${j}">${esc(s)}</button>`).join('');$('feedback').textContent='選一個答案，立即查看解析。';setupLab();}
let c=cueIndex();$('caption').textContent=LESSON.slides[Math.floor(c/5)].captions[c%5];if(speechCaption)$('caption').textContent=speechCaption;if(current!==spokenSlide&&playing){spokenSlide=current;speechCaption=null;speak(slide.captions.slice(Math.min(4,Math.floor((t%30)/6))).join(' '))}lastCue=c;$('seek').value=t;$('bar').style.width=(t/3)+'%';$('time').textContent=format(t)+' / 05:00';}
function format(n){n=Math.floor(n);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function pause(){playing=false;stopSpeech();$('play').textContent='▶ 播放';$('canvas').classList.add('paused')}
function play(){started=true;$('gate').hidden=true;if(t>=300)t=0;playing=true;last=performance.now();$('play').textContent='Ⅱ 暫停';$('canvas').classList.remove('paused');lastCue=-1;spokenSlide=-1;render();}
function jump(n){stopSpeech();t=Math.max(0,Math.min(300,n));lastCue=-1;spokenSlide=-1;render();if(t>=300)pause()}
function frame(now){if(playing){t=Math.max(0,Math.min(300,t+Math.max(0,now-last)/1000));render();if(t>=300){pause();$('status').textContent='五分鐘教學完成。可重播、跳段或繼續做檢核。'}}last=now;requestAnimationFrame(frame)}
$('start').onclick=play;$('play').onclick=()=>playing?pause():play();$('prev').onclick=()=>jump(Math.max(0,current-1)*30);$('next').onclick=()=>jump((current+1)*30);$('restart').onclick=()=>{jump(0);play()};$('seek').oninput=e=>jump(Number(e.target.value));$('mute').onclick=()=>{muted=!muted;$('mute').textContent='語音：'+(muted?'關':'開');$('mute').setAttribute('aria-pressed',String(muted));stopSpeech();if(!muted){spokenSlide=-1;render()}};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){document.body.classList.toggle('full');resize()}};document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('full',!!document.fullscreenElement);resize()});
document.addEventListener('keydown',e=>{if(['INPUT','BUTTON','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.key==='ArrowRight')jump((current+1)*30);if(e.key==='ArrowLeft')jump(Math.max(0,current-1)*30)});
$('chapters').innerHTML=LESSON.slides.map((s,i)=>`<button data-chapter="${i}"><small>${format(i*30)}</small><br>${esc(s.title)}</button>`).join('');$('chapters').onclick=e=>{let b=e.target.closest('button');if(b)jump(+b.dataset.chapter*30)};
$('answers').onclick=e=>{let b=e.target.closest('button');if(!b)return;pause();const s=LESSON.slides[current],a=+b.dataset.answer;b.classList.add(a===s.answer?'correct':'wrong');$('feedback').textContent=(a===s.answer?'答對了。':'再想想。正確答案：'+s.options[s.answer]+'。')+s.explain;};
function setupLab(){let kind=LESSON.slides[current].visual,labels={force:'推力：0–120 N（示範 N=100、μₛ=0.6、μₖ=0.4）',slope:'調整斜面：10–50°',lp:'移動目標直線：P = x + 3y',mountain:'調整高度示意',doors:'選擇一個可能結果，思考代價'};$('labLabel').textContent=labels[kind]||'按圖解卡片，查看本頁概念';let numeric=['force','slope','lp','mountain'].includes(kind);$('labSlider').hidden=!numeric;$('labButtons').innerHTML=kind==='doors'?'<button class="tool" data-door="1">比較 LADY</button><button class="tool" data-door="2">比較 TIGER</button>':numeric?'':LESSON.slides[current].points.map((s,i)=>`<button class="tool" data-point="${i}">概念 ${i+1}</button>`).join('');$('labReadout').textContent=numeric?'拖动會暫停播放；按播放繼續。':kind==='doors'?'選項位置只是比較工具，不表示原文揭曉門的位置。':'按一下查看概念。';}
$('labSlider').oninput=e=>{pause();lab=+e.target.value;$('visual').innerHTML=visual(LESSON.slides[current].visual);let k=LESSON.slides[current].visual;$('labReadout').textContent=k==='force'?`F=${(lab*1.2).toFixed(0)} N；${lab*1.2<=60?'靜摩擦與推力等大':'已滑動，fₖ=40 N'}`:k==='slope'?`θ=${(10+lab*.4).toFixed(0)}°；tanθ=${Math.tan((10+lab*.4)*Math.PI/180).toFixed(2)}`:k==='lp'?`P=${(lab*.12).toFixed(1)}；示範區域最大值 9、最小值 0。`:`高度示意 ${Math.round(lab*30)} m；非實測天氣。`};
$('labButtons').onclick=e=>{let b=e.target.closest('button');if(!b)return;pause();if(b.dataset.door){door=+b.dataset.door;$('visual').innerHTML=visual('doors');$('labReadout').textContent=door===1?'LADY：戀人生存，但必須與別人結婚。這是可能結果比較，非原文答案。':'TIGER：戀人死亡，公主失去所愛。這是可能結果比較，非原文答案。'}else $('labReadout').textContent=LESSON.slides[current].points[+b.dataset.point]};
$('transcript').innerHTML=LESSON.slides.map((s,i)=>`<section><h3>${format(i*30)}–${format((i+1)*30)}　${esc(s.title)}</h3>${s.captions.map((c,j)=>`<p>${format(i*30+j*6)}　${esc(c)}</p>`).join('')}</section>`).join('');$('download').onclick=()=>{const text=LESSON.title+'\n\n'+LESSON.slides.map((s,i)=>`${format(i*30)}–${format((i+1)*30)} ${s.title}\n`+s.captions.map((c,j)=>`${format(i*30+j*6)} ${c}`).join('\n')).join('\n\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download=LESSON.slug+'-transcript.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
window.addEventListener('pagehide',stopSpeech);document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){pause();$('status').textContent='離開頁面已暫停；回來後按播放繼續。'}});if(!synth)$('status').textContent='此瀏覽器不支援語音合成；可使用完整字幕教學。';render();requestAnimationFrame(frame);
